name: CI/CD & Scheduled Scraper

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 22 * * 0-4'  # Run at 22:00 UTC (06:00 Taiwan time) on Sun-Thu (Mon-Fri Taiwan time)
  workflow_dispatch:  # Enable manual trigger from GitHub UI

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: |
        pytest tests/ -v --cov=src --cov-report=term-missing

    - name: Check test coverage
      run: |
        pytest tests/ --cov=src --cov-report=xml --cov-fail-under=50

  scrape:
    name: Run Scraper
    runs-on: ubuntu-latest
    needs: test  # Only run if tests pass
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: 'latest'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper
      env:
        TARGET_URL: ${{ secrets.TARGET_URL }}
        LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        LINE_USER_IDS: ${{ secrets.LINE_USER_IDS }}
        LINE_GROUP_IDS: ${{ secrets.LINE_GROUP_IDS }}
        LINE_CHANNEL_ACCESS_TOKEN_2: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN_2 }}
        LINE_USER_IDS_2: ${{ secrets.LINE_USER_IDS_2 }}
        LINE_GROUP_IDS_2: ${{ secrets.LINE_GROUP_IDS_2 }}
      run: |
        python main.py
